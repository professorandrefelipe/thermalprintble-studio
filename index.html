<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThermalPrintBLE Studio</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <header>
    <div class="logo">
      <h1>ThermalPrintBLE Studio <small>v2.5.0</small></h1>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" onclick="exportImage()">📷 Salvar PNG</button>
      <button class="btn btn-primary" onclick="exportIno()">💻 Exportar .INO</button>
    </div>
  </header>

  <main class="studio-layout">
    <!-- PAINEL DA ESQUERDA: FERRAMENTAS -->
    <aside class="panel sidebar-left">
      <h3>Adicionar Blocos</h3>
      <button onclick="addBlock('text')">📝 Bloco de Texto</button>
      <button onclick="addBlock('rectangle')">🔲 Quadrilátero</button>
      <button onclick="addBlock('circle')">⚪ Círculo</button>
      <button onclick="addBlock('triangle')">🔺 Triângulo</button>
      <button onclick="addBlock('cut')">✂️ Corte de Papel</button>
    </aside>

    <!-- CENTRO: CANVAS DA BOBINA DE PAPEL -->
    <section class="receipt-viewport">
      <div class="paper-container">
        <div class="paper-header">BOBINA (384px)</div>
        <div id="paper" class="paper">
          <!-- Blocos renderizados aqui -->
        </div>
      </div>
    </section>

    <!-- PAINEL DA DIREITA: INSPECTOR DE PROPRIEDADES -->
    <aside class="panel sidebar-right" id="inspector">
      <h3>Inspector de Propriedades</h3>
      <div id="inspector-content">
        <p class="placeholder-text">Selecione um bloco na bobina para editar suas propriedades.</p>
      </div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
