<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThermalPrintBLE Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🖨️ ThermalPrintBLE Studio</h1>
        <p>Gerador de código Arduino compatível com a biblioteca V2.6.3+</p>
        
        <div class="control-group">
            <label for="macInput">Endereço MAC da Impressora:</label>
            <input type="text" id="macInput" value="25:00:13:00:08:ef" placeholder="00:11:22:33:44:55">
        </div>

        <div class="control-group">
            <label for="imageInput">Selecione uma Imagem para Converter:</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>

        <div class="preview-container">
            <p>Preview da Impressão (Redimensionado e Dithering P&B):</p>
            <canvas id="previewCanvas"></canvas>
        </div>

        <button onclick="downloadIno()" id="btnDownload" disabled>Baixar Código (.ino)</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
